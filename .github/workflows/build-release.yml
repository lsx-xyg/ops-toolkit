name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpsToolkit-windows.exe
            out: OpsToolkit.exe
          - os: macos-latest
            artifact: OpsToolkit-macos
            out: OpsToolkit
          - os: ubuntu-latest
            artifact: OpsToolkit-linux
            out: OpsToolkit

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: |
          uv venv
          uv pip install -e .
          uv pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv run pyinstaller --onefile --windowed --name OpsToolkit \
              --collect-all tkinter \
              src/ops_toolkit/app.py
          else
            uv run pyinstaller --onefile --windowed --name OpsToolkit \
              src/ops_toolkit/app.py
          fi

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv OpsToolkit.exe "${{ matrix.artifact }}"
          else
            mv OpsToolkit "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
