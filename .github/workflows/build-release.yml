name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        shell: bash
        run: |
          uv venv
          uv pip install -e .
          uv pip install pyinstaller

      - name: Build exe
        shell: bash
        run: |
          uv run pyinstaller --onefile --windowed --name OpsToolkit run.py

      - name: Rename
        shell: bash
        run: mv dist/OpsToolkit.exe dist/OpsToolkit-windows.exe

      - name: Upload artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: OpsToolkit-windows
          path: dist/OpsToolkit-windows.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpsToolkit-windows.exe
          generate_release_notes: true
