[project]
name = "ops-toolkit"
version = "0.1.1"
description = "可扩展的多平台运维工具箱"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "PyGithub>=2.5.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8.0"]

[project.gui-scripts]
opsbox-gui = "ops_toolkit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_toolkit"]
